name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Run PR commit-range preflight
        if: github.event_name == 'pull_request'
        run: python scripts/preflight.py . --git-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Run pushed commit-range preflight
        if: github.event_name == 'push'
        run: python scripts/preflight.py . --git-range "${{ github.event.before }}..${{ github.sha }}"
      - name: Run full-history release preflight
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/preflight.py .
